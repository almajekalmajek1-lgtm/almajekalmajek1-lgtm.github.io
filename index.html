<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>سجل ساعات العمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1EF;
    --paper-line:#DCE1DD;
    --card:#FBFBF9;
    --ink:#1B2A41;
    --ink-soft:#5B6B7F;
    --brass:#B8873B;
    --brass-soft:#EFE1C7;
    --good:#4C7A5D;
    --good-soft:#E1EBE3;
    --warn:#B24C33;
    --warn-soft:#F3E0DA;
    --line:#C9CFC9;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 28px),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:15px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  header.topbar{
    padding:18px 18px 10px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  header.topbar h1{
    font-size:17px;
    font-weight:700;
    margin:0;
    letter-spacing:.2px;
  }
  header.topbar .stamp{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px 10px;
    background:var(--card);
  }

  main{ flex:1; padding:0 14px 90px; overflow-y:auto; }
  .screen{ display:none; }
  .screen.active{ display:block; animation:fade .18s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 1px 0 rgba(27,42,65,.04);
  }
  .card h2{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 12px;
  }

  /* ---------- Today screen ---------- */
  .date-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .date-nav button{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .date-nav .date-label{
    text-align:center;
  }
  .date-nav .date-label .day-name{
    font-size:13px; color:var(--ink-soft);
  }
  .date-nav .date-label .day-date{
    font-size:16px; font-weight:700;
  }

  .total-display{
    text-align:center;
    padding:18px 0 10px;
  }
  .total-display .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:44px;
    font-weight:700;
    letter-spacing:1px;
  }
  .total-display .sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .bar-track{
    height:6px;
    border-radius:4px;
    background:var(--paper-line);
    overflow:hidden;
    margin:10px 4px 4px;
  }
  .bar-fill{
    height:100%;
    background:var(--brass);
    border-radius:4px;
    transition:width .25s ease;
  }
  .bar-fill.good{ background:var(--good); }

  .field-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 0;
    border-top:1px dashed var(--line);
  }
  .field-row:first-of-type{ border-top:none; }
  .field-row label{ font-size:14px; color:var(--ink); }
  select, input[type=time], input[type=date], input[type=number], input[type=text]{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 10px;
  }
  input[type=time]{ font-family:'IBM Plex Mono', monospace; }

  .period-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 0;
    border-top:1px dashed var(--line);
  }
  .period-row .plabel{ color:var(--ink-soft); font-size:13px; }

  .ghost-btn{
    width:100%;
    margin-top:8px;
    padding:9px;
    border-radius:8px;
    border:1px dashed var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13px;
  }

  textarea{
    width:100%;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px;
    resize:vertical;
    min-height:44px;
  }

  .save-btn{
    width:100%;
    padding:14px;
    margin-top:6px;
    border:none;
    border-radius:12px;
    background:var(--ink);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
  }
  .save-btn:active{ opacity:.85; }
  .save-msg{
    text-align:center;
    font-size:12px;
    color:var(--good);
    margin-top:8px;
    min-height:14px;
  }

  /* ---------- Log screen ---------- */
  .log-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 4px;
    border-top:1px dashed var(--line);
  }
  .log-item:first-child{ border-top:none; }
  .log-item .ld{ font-size:13px; }
  .log-item .ld .dow{ color:var(--ink-soft); font-size:11px; }
  .badge{
    font-size:11px;
    padding:2px 9px;
    border-radius:20px;
    font-weight:600;
  }
  .badge.work{ background:var(--brass-soft); color:#8a611f; }
  .badge.off{ background:var(--good-soft); color:var(--good); }
  .badge.absent{ background:var(--warn-soft); color:var(--warn); }
  .log-item .lt{ font-family:'IBM Plex Mono', monospace; font-size:14px; font-weight:600; }
  .log-item .lt.zero{ color:var(--warn); }
  .empty-note{ text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 0; }

  /* ---------- Summary screen ---------- */
  .stat-big{
    display:flex; align-items:baseline; gap:8px; justify-content:center;
    padding:6px 0 2px;
  }
  .stat-big .n{ font-family:'IBM Plex Mono', monospace; font-size:30px; font-weight:700; }
  .stat-big .of{ font-size:13px; color:var(--ink-soft); }
  .alert-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 0; border-top:1px dashed var(--line);
    font-size:13px;
  }
  .alert-row:first-of-type{ border-top:none; }
  .alert-row .a-date{ color:var(--warn); }

  /* ---------- Settings screen ---------- */
  .settings-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-top:1px dashed var(--line);
    gap:10px;
  }
  .settings-row:first-of-type{ border-top:none; }
  .settings-row label{ font-size:13px; flex:1; }
  .settings-row input, .settings-row select{ width:130px; text-align:center; }

  /* ---------- Tab bar ---------- */
  nav.tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    padding:8px 0 4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  nav.tabbar button .dot{
    width:5px; height:5px; border-radius:50%;
    background:transparent;
  }
  nav.tabbar button.active{ color:var(--ink); font-weight:600; }
  nav.tabbar button.active .dot{ background:var(--brass); }

  .loading{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 0; }

  #googleAccountBox{
    background:var(--good-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
  }
  #googleSyncBtn{ background:var(--card); }
  #googleForgetBtn{ background:var(--card); }

</style>
</head>
<body>

<header class="topbar">
  <h1>سجل ساعات العمل</h1>
  <span class="stamp mono" id="cycleStamp">—</span>
</header>

<main>

  <!-- ===== TODAY ===== -->
  <section class="screen active" id="screen-today">
    <div class="card">
      <div class="date-nav">
        <button id="prevDay">‹</button>
        <div class="date-label">
          <div class="day-name" id="dayName">—</div>
          <div class="day-date" id="dayDate">—</div>
        </div>
        <button id="nextDay">›</button>
      </div>

      <div class="total-display">
        <div class="num mono" id="totalNum">00:00</div>
        <div class="sub" id="totalSub">من ٨ ساعات مستهدفة</div>
        <div class="bar-track"><div class="bar-fill" id="totalBar" style="width:0%"></div></div>
      </div>

      <div class="field-row">
        <label>حالة اليوم</label>
        <select id="statusSelect">
          <option value="عمل">عمل</option>
          <option value="إجازة">إجازة</option>
          <option value="غياب">غياب</option>
        </select>
      </div>

      <div id="periodsWrap"></div>
      <button class="ghost-btn" id="addPeriodBtn">+ إضافة فترة</button>

      <div class="field-row" style="display:block; border-top:1px dashed var(--line); padding-top:12px; margin-top:6px;">
        <label style="display:block; margin-bottom:6px;">ملاحظات</label>
        <textarea id="notesInput" placeholder="اختياري"></textarea>
      </div>
    </div>

    <button class="save-btn" id="saveBtn">حفظ اليوم</button>
    <div class="save-msg" id="saveMsg"></div>
  </section>

  <!-- ===== LOG ===== -->
  <section class="screen" id="screen-log">
    <div class="card">
      <h2>آخر الأيام المسجّلة</h2>
      <div id="logList"><div class="loading">جارٍ التحميل…</div></div>
    </div>
  </section>

  <!-- ===== SUMMARY ===== -->
  <section class="screen" id="screen-summary">
    <div class="card">
      <h2 id="cycleTitle">الدورة الشهرية</h2>
      <div class="stat-big">
        <span class="n mono" id="cycleActual">00:00</span>
        <span class="of">/ <span id="cycleTarget">00:00</span></span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="cycleBar" style="width:0%"></div></div>
      <div class="sub" style="text-align:center; margin-top:8px; color:var(--ink-soft); font-size:12px;" id="cycleDaysNote">—</div>
    </div>

    <div class="card">
      <h2>هذا الأسبوع</h2>
      <div class="stat-big">
        <span class="n mono" id="weekActual">00:00</span>
        <span class="of">/ <span id="weekTarget">00:00</span></span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="weekBar" style="width:0%"></div></div>
    </div>

    <div class="card">
      <h2>أيام ناقصة الساعات</h2>
      <div id="alertsList"><div class="loading">جارٍ التحميل…</div></div>
    </div>
  </section>

  <!-- ===== SETTINGS ===== -->
  <section class="screen" id="screen-settings">
    <div class="card">
      <h2>الإعدادات</h2>
      <div class="settings-row"><label>تاريخ أول يوم عمل</label><input type="date" id="s_firstDay"></div>
      <div class="settings-row"><label>يوم بداية الدورة الشهرية</label><input type="number" id="s_cycleStart" min="1" max="28"></div>
      <div class="settings-row"><label>المستهدف الشهري (ساعة)</label><input type="number" id="s_monthlyTarget" min="1"></div>
      <div class="settings-row"><label>الساعات اليومية المستهدفة</label><input type="number" id="s_dailyTarget" min="0" step="0.5"></div>
      <div class="settings-row"><label>عدد فترات العمل اليومية</label><input type="number" id="s_periodsCount" min="1" max="10"></div>
      <div class="settings-row"><label>بداية الأسبوع</label>
        <select id="s_weekStart">
          <option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option>
          <option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option><option value="7">الأحد</option>
        </select>
      </div>
      <div class="settings-row"><label>يوم العطلة الأول</label>
        <select id="s_weekend1">
          <option value="0">بدون</option>
          <option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option>
          <option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option><option value="7">الأحد</option>
        </select>
      </div>
      <div class="settings-row"><label>يوم العطلة الثاني</label>
        <select id="s_weekend2">
          <option value="0">بدون</option>
          <option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option>
          <option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option><option value="7">الأحد</option>
        </select>
      </div>
    </div>

    <div class="card" style="margin-top:12px;">
      <h2>مزامنة Google Drive</h2>
      <div id="googleAccountBox" style="font-size:13px; color:var(--ink-soft); margin-bottom:10px;">
        لم تتم إضافة حساب Google بعد.
      </div>
      <button class="save-btn" id="googleLoginBtn" type="button">إضافة حساب Google</button>
      <button class="ghost-btn" id="googleSyncBtn" type="button" style="margin-top:8px;">مزامنة الآن</button>
      <button class="ghost-btn" id="googleForgetBtn" type="button" style="margin-top:8px; color:var(--warn);">إزالة الحساب المحفوظ</button>
      <div class="save-msg" id="googleSyncMsg"></div>
    </div>

    <button class="save-btn" id="saveSettingsBtn">حفظ الإعدادات</button>
    <div class="save-msg" id="saveSettingsMsg"></div>
  </section>

</main>

<nav class="tabbar">
  <button class="tab-btn active" data-screen="today"><span class="dot"></span>اليوم</button>
  <button class="tab-btn" data-screen="log"><span class="dot"></span>السجل</button>
  <button class="tab-btn" data-screen="summary"><span class="dot"></span>الملخص</button>
  <button class="tab-btn" data-screen="settings"><span class="dot"></span>الإعدادات</button>
</nav>

<script>
(function(){
  "use strict";

  const DOW_AR = ['الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت','الأحد']; // index 0 = Monday
  const DOW_AR_FULL = {1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس',5:'الجمعة',6:'السبت',7:'الأحد'};

  const DEFAULT_SETTINGS = {
    firstWorkDay: fmtDate(new Date()),
    cycleStartDay: 18,
    monthlyTarget: 80,
    dailyTarget: 8,
    periodsCount: 7,
    weekStart: 2,
    weekend1: 5,
    weekend2: 6
  };

  let settings = { ...DEFAULT_SETTINGS };
  let currentDate = new Date();
  let periodCountShown = 1;
  const monthCache = {}; // 'YYYY-MM' -> {day: {status, periods:[min...], notes}}

  // ---------- date helpers ----------
  function pad2(n){ return String(n).padStart(2,'0'); }
  function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
  function monthKeyOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
  function dayKeyOf(d){ return pad2(d.getDate()); }
  function isoWeekday(d){ return d.getDay()===0 ? 7 : d.getDay(); } // Monday=1..Sunday=7
  function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function sameDay(a,b){ return fmtDate(a)===fmtDate(b); }
  function todayStart(){ const t=new Date(); t.setHours(0,0,0,0); return t; }

  function minutesToLabel(min){
    const h = Math.floor(min/60), m = min%60;
    return pad2(h)+':'+pad2(m);
  }
  function timeToMinutes(t){
    if(!t) return 0;
    const [h,m] = t.split(':').map(Number);
    return (h||0)*60 + (m||0);
  }

  function cycleRangeFor(d, cycleStartDay){
    let start;
    if(d.getDate() < cycleStartDay){
      start = new Date(d.getFullYear(), d.getMonth()-1, cycleStartDay);
    } else {
      start = new Date(d.getFullYear(), d.getMonth(), cycleStartDay);
    }
    const end = addDays(new Date(start.getFullYear(), start.getMonth()+1, start.getDate()), -1);
    return {start, end, label: monthKeyOf(start)};
  }
  function weekRangeFor(d, weekStart){
    const wd = isoWeekday(d);
    const diff = (wd - weekStart + 7) % 7;
    const start = addDays(d, -diff);
    const end = addDays(start, 6);
    return {start, end};
  }

  // ---------- storage ----------
  // GitHub Pages لا يوفر window.storage، لذلك نستخدم localStorage تلقائياً.
  // وإذا كان window.storage موجوداً في بيئة أخرى، نستخدمه مع الاحتفاظ بنسخة محلية.
  async function storageGet(key){
    try{
      if(window.storage && typeof window.storage.get === 'function'){
        const res = await window.storage.get(key, false);
        if(res && res.value != null){
          try{ localStorage.setItem('worklog:'+key, res.value); }catch(e){}
          return res.value;
        }
      }
    }catch(e){}
    try{ return localStorage.getItem('worklog:'+key); }catch(e){ return null; }
  }

  async function storageSet(key, value){
    let ok = false;
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        await window.storage.set(key, value, false);
        ok = true;
      }
    }catch(e){}
    try{
      localStorage.setItem('worklog:'+key, value);
      ok = true;
    }catch(e){}
    if(!ok) throw new Error('تعذر حفظ البيانات محلياً');
  }

  async function loadSettings(){
    try{
      const raw = await storageGet('settings');
      if(raw) settings = { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
    }catch(e){ /* use defaults */ }
  }

  async function saveSettingsToStorage(){
    await storageSet('settings', JSON.stringify(settings));
  }

  async function getMonthBucket(monthKey){
    if(monthCache[monthKey]) return monthCache[monthKey];
    let data = {};
    try{
      const raw = await storageGet('entries:'+monthKey);
      if(raw) data = JSON.parse(raw);
    }catch(e){ /* empty month */ }
    monthCache[monthKey] = data;
    return data;
  }

  async function saveEntry(dateObj, entry){
    const mk = monthKeyOf(dateObj), dk = dayKeyOf(dateObj);
    const bucket = await getMonthBucket(mk);
    entry = { ...entry, updatedAt: new Date().toISOString() };
    bucket[dk] = entry;
    monthCache[mk] = bucket;
    await storageSet('entries:'+mk, JSON.stringify(bucket));
  }

  async function getEntry(dateObj){
    const bucket = await getMonthBucket(monthKeyOf(dateObj));
    return bucket[dayKeyOf(dateObj)] || null;
  }

  // ---------- Google account persistence ----------
  const GOOGLE_CLIENT_ID = '195409386887-4v5dl2aciope9shglvssotrof4nusju0.apps.googleusercontent.com';
  const GOOGLE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email';
  const GOOGLE_EMAIL_KEY = 'google_email';
  const GOOGLE_FILE_NAME = 'سجل_ساعات_العمل_مزامنة.json';
  let googleTokenClient = null;
  let googleAccessToken = null;
  let googleTokenExpiresAt = 0;

  function getSavedGoogleEmail(){
    try{ return localStorage.getItem('worklog:'+GOOGLE_EMAIL_KEY) || ''; }catch(e){ return ''; }
  }

  function setSavedGoogleEmail(email){
    try{
      if(email) localStorage.setItem('worklog:'+GOOGLE_EMAIL_KEY, email);
      else localStorage.removeItem('worklog:'+GOOGLE_EMAIL_KEY);
    }catch(e){}
    renderGoogleAccount();
  }

  function renderGoogleAccount(){
    const box = document.getElementById('googleAccountBox');
    const email = getSavedGoogleEmail();
    if(email){
      box.textContent = 'الحساب المحفوظ: '+email+' — يمكنك الضغط على «مزامنة الآن» بعد تحديث الصفحة.';
      document.getElementById('googleLoginBtn').textContent = 'تغيير حساب Google';
    }else{
      box.textContent = 'لم تتم إضافة حساب Google بعد.';
      document.getElementById('googleLoginBtn').textContent = 'إضافة حساب Google';
    }
  }

  function waitForGoogleIdentity(){
    return new Promise((resolve,reject)=>{
      let tries = 0;
      const timer = setInterval(()=>{
        tries++;
        if(window.google && google.accounts && google.accounts.oauth2){
          clearInterval(timer);
          resolve();
        }else if(tries > 80){
          clearInterval(timer);
          reject(new Error('تعذر تحميل خدمة Google. تأكد من اتصال الإنترنت.'));
        }
      },100);
    });
  }

  async function ensureGoogleToken(){
    await waitForGoogleIdentity();
    return new Promise((resolve,reject)=>{
      googleTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GOOGLE_SCOPE,
        callback: async (response)=>{
          if(response && response.access_token){
            googleAccessToken = response.access_token;
            googleTokenExpiresAt = Date.now() + ((response.expires_in || 3600) * 1000) - 60000;
            try{
              const u = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers:{ Authorization:'Bearer '+googleAccessToken }
              });
              if(u.ok){
                const info = await u.json();
                if(info.email) setSavedGoogleEmail(info.email);
              }
            }catch(e){}
            resolve(googleAccessToken);
          }else{
            reject(new Error('لم يتم الحصول على إذن Google.'));
          }
        },
        error_callback: ()=>reject(new Error('تم إلغاء تسجيل الدخول أو رفض الإذن.'))
      });

      const prompt = getSavedGoogleEmail() ? '' : 'select_account';
      googleTokenClient.requestAccessToken({prompt});
    });
  }

  async function googleApi(url, options={}){
    let token = googleAccessToken;
    if(!token || Date.now() >= googleTokenExpiresAt){
      token = await ensureGoogleToken();
    }
    const headers = new Headers(options.headers || {});
    headers.set('Authorization','Bearer '+token);
    const res = await fetch(url,{...options,headers});
    if(res.status === 401){
      googleAccessToken = null;
      token = await ensureGoogleToken();
      headers.set('Authorization','Bearer '+token);
      return fetch(url,{...options,headers});
    }
    return res;
  }

  async function collectAllLocalData(){
    const months = {};
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('worklog:entries:')){
          const month = k.slice('worklog:entries:'.length);
          try{ months[month] = JSON.parse(localStorage.getItem(k)); }catch(e){}
        }
      }
    }catch(e){}
    return {
      version: 2,
      exportedAt: new Date().toISOString(),
      settings,
      months
    };
  }

  async function listSyncFile(){
    const q = "name = '"+GOOGLE_FILE_NAME.replace(/'/g,"\\'")+"' and trashed = false";
    const url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+encodeURIComponent(q)+'&fields=files(id,name,modifiedTime)';
    const res = await googleApi(url);
    if(!res.ok) throw new Error('تعذر الوصول إلى Google Drive.');
    const data = await res.json();
    return data.files && data.files[0] ? data.files[0] : null;
  }

  async function downloadSyncFile(fileId){
    const res = await googleApi('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fileId)+'?alt=media');
    if(!res.ok) throw new Error('تعذر قراءة نسخة المزامنة.');
    return await res.json();
  }

  async function uploadSyncFile(payload, fileId){
    const metadata = {
      name: GOOGLE_FILE_NAME,
      mimeType: 'application/json',
      ...(fileId ? {} : {parents:['appDataFolder']})
    };
    const boundary = 'worklog_boundary_'+Date.now();
    const body =
      '--'+boundary+'\r\n'+
      'Content-Type: application/json; charset=UTF-8\r\n\r\n'+
      JSON.stringify(metadata)+'\r\n'+
      '--'+boundary+'\r\n'+
      'Content-Type: application/json; charset=UTF-8\r\n\r\n'+
      JSON.stringify(payload)+'\r\n'+
      '--'+boundary+'--';

    const endpoint = fileId
      ? 'https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(fileId)+'?uploadType=multipart'
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';

    const res = await googleApi(endpoint,{
      method:fileId?'PATCH':'POST',
      headers:{'Content-Type':'multipart/related; boundary='+boundary},
      body
    });
    if(!res.ok) throw new Error('تعذر حفظ البيانات في Google Drive.');
    return await res.json();
  }

  function mergeSyncData(local, remote){
    const merged = {
      version: 2,
      exportedAt: new Date().toISOString(),
      settings: {...DEFAULT_SETTINGS, ...(local.settings||{})},
      months: {...(local.months||{})}
    };

    // ندمج كل يوم، والأحدث updatedAt يفوز.
    Object.entries(remote.months||{}).forEach(([mk, remoteBucket])=>{
      if(!merged.months[mk]) merged.months[mk] = {};
      Object.entries(remoteBucket||{}).forEach(([dk, remoteEntry])=>{
        const localEntry = merged.months[mk][dk];
        const rt = remoteEntry && remoteEntry.updatedAt ? new Date(remoteEntry.updatedAt).getTime() : 0;
        const lt = localEntry && localEntry.updatedAt ? new Date(localEntry.updatedAt).getTime() : 0;
        if(!localEntry || rt > lt) merged.months[mk][dk] = remoteEntry;
      });
    });

    // الإعدادات القديمة التي لا تحمل updatedAt لا تستبدل إعدادات الجهاز.
    if(remote.settings && remote.settings.updatedAt){
      const rt = new Date(remote.settings.updatedAt).getTime();
      const lt = local.settings && local.settings.updatedAt ? new Date(local.settings.updatedAt).getTime() : 0;
      if(rt > lt) merged.settings = {...DEFAULT_SETTINGS, ...remote.settings};
    }
    return merged;
  }

  async function applySyncData(data){
    if(data.settings){
      settings = {...DEFAULT_SETTINGS, ...data.settings};
      await storageSet('settings', JSON.stringify(settings));
    }
    for(const [mk,bucket] of Object.entries(data.months||{})){
      monthCache[mk] = bucket || {};
      await storageSet('entries:'+mk, JSON.stringify(bucket||{}));
    }
  }

  async function syncWithGoogle(){
    const msg = document.getElementById('googleSyncMsg');
    msg.textContent = 'جارٍ المزامنة…';
    try{
      await ensureGoogleToken();
      const local = await collectAllLocalData();
      const file = await listSyncFile();

      if(!file){
        await uploadSyncFile(local, null);
        msg.textContent = 'تم إنشاء نسخة المزامنة على Google Drive ✓';
      }else{
        const remote = await downloadSyncFile(file.id);
        const merged = mergeSyncData(local, remote);
        await applySyncData(merged);
        merged.exportedAt = new Date().toISOString();
        await uploadSyncFile(merged, file.id);
        msg.textContent = 'تمت المزامنة بنجاح ✓';
      }

      await renderToday();
      refreshSummaryIfActive();
      refreshLogIfActive();
    }catch(e){
      msg.textContent = e && e.message ? e.message : 'تعذرت المزامنة.';
    }
  }

  document.getElementById('googleLoginBtn').addEventListener('click', async ()=>{
    const msg = document.getElementById('googleSyncMsg');
    msg.textContent = 'جارٍ فتح حساب Google…';
    try{
      await ensureGoogleToken();
      msg.textContent = 'تم حفظ البريد. يمكنك الآن المزامنة بضغطة واحدة ✓';
    }catch(e){
      msg.textContent = e && e.message ? e.message : 'تعذر تسجيل الدخول إلى Google.';
    }
  });

  document.getElementById('googleSyncBtn').addEventListener('click', syncWithGoogle);

  document.getElementById('googleForgetBtn').addEventListener('click', ()=>{
    const email = getSavedGoogleEmail();
    if(googleAccessToken && window.google && google.accounts && google.accounts.oauth2){
      try{ google.accounts.oauth2.revoke(googleAccessToken, ()=>{}); }catch(e){}
    }
    googleAccessToken = null;
    googleTokenExpiresAt = 0;
    setSavedGoogleEmail('');
    document.getElementById('googleSyncMsg').textContent =
      email ? 'تمت إزالة الحساب المحفوظ من هذا الجهاز.' : 'لا يوجد حساب محفوظ.';
  });

  renderGoogleAccount();

  // ---------- Today screen ----------
  function renderPeriods(existingPeriods){
    const wrap = document.getElementById('periodsWrap');
    wrap.innerHTML = '';
    const vals = existingPeriods && existingPeriods.length ? existingPeriods.slice() : [0];
    periodCountShown = Math.max(1, Math.min(settings.periodsCount, vals.length));
    for(let i=0;i<periodCountShown;i++){
      const row = document.createElement('div');
      row.className = 'period-row';
      const min = vals[i] || 0;
      row.innerHTML = `<span class="plabel">فترة ${i+1}</span><input type="time" class="period-input" data-idx="${i}" value="${min?minutesToLabel(min):''}">`;
      wrap.appendChild(row);
    }
    document.getElementById('addPeriodBtn').style.display = periodCountShown >= settings.periodsCount ? 'none' : 'block';
    wrap.querySelectorAll('.period-input').forEach(inp=> inp.addEventListener('input', updateTotalDisplay));
  }

  function collectPeriods(){
    return Array.from(document.querySelectorAll('.period-input')).map(inp=> timeToMinutes(inp.value));
  }

  function updateTotalDisplay(){
    const mins = collectPeriods().reduce((a,b)=>a+b,0);
    document.getElementById('totalNum').textContent = minutesToLabel(mins);
    const targetMin = settings.dailyTarget*60;
    document.getElementById('totalSub').textContent = 'من '+settings.dailyTarget+' ساعات مستهدفة';
    const pct = targetMin>0 ? Math.min(100, (mins/targetMin)*100) : 0;
    const bar = document.getElementById('totalBar');
    bar.style.width = pct+'%';
    bar.classList.toggle('good', mins>=targetMin && targetMin>0);
  }

  async function renderToday(){
    const d = currentDate;
    document.getElementById('dayName').textContent = DOW_AR[isoWeekday(d)-1];
    document.getElementById('dayDate').textContent = d.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});
    const stamp = cycleRangeFor(d, settings.cycleStartDay);
    document.getElementById('cycleStamp').textContent = stamp.label;

    const entry = await getEntry(d);
    document.getElementById('statusSelect').value = entry ? entry.status : 'عمل';
    document.getElementById('notesInput').value = entry ? (entry.notes||'') : '';
    renderPeriods(entry ? entry.periods : null);
    updateTotalDisplay();
    document.getElementById('saveMsg').textContent = '';
  }

  document.getElementById('prevDay').addEventListener('click', ()=>{ currentDate = addDays(currentDate,-1); renderToday(); });
  document.getElementById('nextDay').addEventListener('click', ()=>{ currentDate = addDays(currentDate,1); renderToday(); });
  document.getElementById('addPeriodBtn').addEventListener('click', ()=>{
    if(periodCountShown < settings.periodsCount){
      const periods = collectPeriods();
      periods.push(0);
      renderPeriods(periods);
      updateTotalDisplay();
    }
  });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const entry = {
      status: document.getElementById('statusSelect').value,
      periods: collectPeriods(),
      notes: document.getElementById('notesInput').value
    };
    try{
      await saveEntry(currentDate, entry);
      document.getElementById('saveMsg').textContent = 'تم الحفظ ✓';
      refreshSummaryIfActive();
      refreshLogIfActive();
    }catch(e){
      document.getElementById('saveMsg').textContent = 'تعذّر الحفظ، حاول مرة أخرى';
    }
  });

  // ---------- Log screen ----------
  async function renderLog(){
    const list = document.getElementById('logList');
    list.innerHTML = '<div class="loading">جارٍ التحميل…</div>';
    const days = [];
    let cursor = new Date();
    for(let i=0;i<30;i++){
      days.push(new Date(cursor));
      cursor = addDays(cursor,-1);
    }
    const rows = [];
    for(const d of days){
      const entry = await getEntry(d);
      if(entry) rows.push({date:d, entry});
    }
    if(!rows.length){
      list.innerHTML = '<div class="empty-note">لا توجد أيام مسجّلة بعد</div>';
      return;
    }
    list.innerHTML = '';
    rows.forEach(({date, entry})=>{
      const mins = (entry.periods||[]).reduce((a,b)=>a+b,0);
      const badgeClass = entry.status==='عمل' ? 'work' : (entry.status==='إجازة' ? 'off' : 'absent');
      const row = document.createElement('div');
      row.className = 'log-item';
      row.innerHTML = `
        <div class="ld">
          <div class="dow">${DOW_AR[isoWeekday(date)-1]}</div>
          <div>${date.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}</div>
        </div>
        <span class="badge ${badgeClass}">${entry.status}</span>
        <span class="lt ${mins===0 && entry.status==='عمل' ? 'zero':''}">${minutesToLabel(mins)}</span>`;
      row.addEventListener('click', ()=>{
        currentDate = date;
        switchScreen('today');
        renderToday();
      });
      list.appendChild(row);
    });
  }

  // ---------- Summary screen ----------
  async function sumRange(start, end, wantMissing){
    let total = 0;
    const missing = [];
    let cursor = new Date(start);
    const today = todayStart();
    while(cursor <= end){
      const entry = await getEntry(cursor);
      if(entry){
        const mins = (entry.periods||[]).reduce((a,b)=>a+b,0);
        total += mins;
        if(wantMissing && entry.status==='عمل' && mins===0 && cursor<=today){
          missing.push(new Date(cursor));
        }
      }
      cursor = addDays(cursor,1);
    }
    return {total, missing};
  }

  async function renderSummary(){
    const d = new Date();
    const cyc = cycleRangeFor(d, settings.cycleStartDay);
    document.getElementById('cycleTitle').textContent = 'الدورة الشهرية ('+cyc.label+')';
    const cycRes = await sumRange(cyc.start, cyc.end, true);
    document.getElementById('cycleActual').textContent = minutesToLabel(cycRes.total);
    document.getElementById('cycleTarget').textContent = settings.monthlyTarget+':00';
    const cpct = Math.min(100, (cycRes.total/(settings.monthlyTarget*60))*100);
    const cbar = document.getElementById('cycleBar');
    cbar.style.width = cpct+'%';
    cbar.classList.toggle('good', cpct>=100);
    document.getElementById('cycleDaysNote').textContent =
      cyc.start.toLocaleDateString('ar-EG',{day:'numeric',month:'short'}) + ' — ' +
      cyc.end.toLocaleDateString('ar-EG',{day:'numeric',month:'short'});

    const wk = weekRangeFor(d, settings.weekStart);
    const wkRes = await sumRange(wk.start, wk.end, false);
    document.getElementById('weekActual').textContent = minutesToLabel(wkRes.total);
    const weeklyTarget = settings.monthlyTarget/4;
    document.getElementById('weekTarget').textContent = minutesToLabel(Math.round(weeklyTarget*60));
    const wpct = Math.min(100, (wkRes.total/(weeklyTarget*60))*100);
    const wbar = document.getElementById('weekBar');
    wbar.style.width = wpct+'%';
    wbar.classList.toggle('good', wpct>=100);

    const alertsList = document.getElementById('alertsList');
    if(!cycRes.missing.length){
      alertsList.innerHTML = '<div class="empty-note">لا يوجد أيام ناقصة الساعات 🎉</div>';
    } else {
      alertsList.innerHTML = '';
      cycRes.missing.slice().reverse().forEach(dt=>{
        const row = document.createElement('div');
        row.className = 'alert-row';
        row.innerHTML = `<span>${DOW_AR[isoWeekday(dt)-1]}</span><span class="a-date mono">${dt.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}</span>`;
        row.addEventListener('click', ()=>{ currentDate=dt; switchScreen('today'); renderToday(); });
        alertsList.appendChild(row);
      });
    }
  }

  // ---------- Settings screen ----------
  function renderSettingsForm(){
    document.getElementById('s_firstDay').value = settings.firstWorkDay;
    document.getElementById('s_cycleStart').value = settings.cycleStartDay;
    document.getElementById('s_monthlyTarget').value = settings.monthlyTarget;
    document.getElementById('s_dailyTarget').value = settings.dailyTarget;
    document.getElementById('s_periodsCount').value = settings.periodsCount;
    document.getElementById('s_weekStart').value = settings.weekStart;
    document.getElementById('s_weekend1').value = settings.weekend1;
    document.getElementById('s_weekend2').value = settings.weekend2;
  }
  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    settings.firstWorkDay = document.getElementById('s_firstDay').value || settings.firstWorkDay;
    settings.cycleStartDay = parseInt(document.getElementById('s_cycleStart').value) || 1;
    settings.monthlyTarget = parseFloat(document.getElementById('s_monthlyTarget').value) || 0;
    settings.dailyTarget = parseFloat(document.getElementById('s_dailyTarget').value) || 0;
    settings.periodsCount = parseInt(document.getElementById('s_periodsCount').value) || 1;
    settings.weekStart = parseInt(document.getElementById('s_weekStart').value);
    settings.weekend1 = parseInt(document.getElementById('s_weekend1').value);
    settings.weekend2 = parseInt(document.getElementById('s_weekend2').value);
    settings.updatedAt = new Date().toISOString();
    try{
      await saveSettingsToStorage();
      document.getElementById('saveSettingsMsg').textContent = 'تم حفظ الإعدادات ✓';
      renderToday();
    }catch(e){
      document.getElementById('saveSettingsMsg').textContent = 'تعذّر الحفظ';
    }
  });

  // ---------- Tabs ----------
  function switchScreen(name){
    document.querySelectorAll('.screen').forEach(s=> s.classList.remove('active'));
    document.getElementById('screen-'+name).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.screen===name));
    if(name==='log') renderLog();
    if(name==='summary') renderSummary();
    if(name==='settings') renderSettingsForm();
  }
  function refreshSummaryIfActive(){ if(document.getElementById('screen-summary').classList.contains('active')) renderSummary(); }
  function refreshLogIfActive(){ if(document.getElementById('screen-log').classList.contains('active')) renderLog(); }

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> switchScreen(btn.dataset.screen));
  });

  // ---------- init ----------
  (async function init(){
    await loadSettings();
    renderGoogleAccount();
    currentDate = new Date();
    renderToday();
  })();

})();
</script>
